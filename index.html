<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart - Electronics Store</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1400px; margin: 0 auto; display: flex;
            align-items: center; justify-content: space-between;
        }

        .nav-logo {
            display: flex; align-items: center; gap: 1rem;
            font-size: 1.25rem; font-weight: 700; color: #667eea;
        }

        .nav-actions { display: flex; gap: 1rem; }

        .cart-icon, .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; position: relative;
        }

        .cart-icon:hover, .user-avatar:hover {
            background: rgba(102, 126, 234, 0.1); transform: translateY(-2px);
        }

        .cart-count {
            position: absolute; top: -5px; right: -5px;
            background: #f44336; color: white; border-radius: 50%;
            width: 20px; height: 20px; font-size: 0.75rem;
            display: none; align-items: center; justify-content: center;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; padding-top: 120px; }

        .hero-section {
            display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
            align-items: center; margin-bottom: 4rem;
        }

        .hero-title {
            font-size: 3rem; font-weight: 800; color: white;
            margin-bottom: 1.5rem; line-height: 1.2;
        }

        .gradient-text {
            background: linear-gradient(45deg, #f093fb, white);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.125rem; color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem; line-height: 1.8;
        }

        .hero-stats { display: flex; gap: 2rem; margin-bottom: 2rem; }

        .stat-item { text-align: center; }
        .stat-number { display: block; font-size: 1.5rem; font-weight: 700; color: white; }
        .stat-label { font-size: 0.875rem; color: rgba(255, 255, 255, 0.8); }

        .cta-button {
            background: linear-gradient(45deg, #f093fb, #667eea);
            color: white; border: none; padding: 1.5rem 3rem;
            border-radius: 30px; font-size: 1.125rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
        }

        .cta-button:hover { transform: translateY(-3px); }

        #heroCanvas { width: 100%; height: 400px; border-radius: 20px; }

        .section-title {
            font-size: 2rem; text-align: center; margin-bottom: 3rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            padding: 2rem; margin-bottom: 3rem;
        }

        .search-container { display: flex; gap: 1rem; margin-bottom: 2rem; }

        .search-input {
            flex: 1; padding: 1rem 1.5rem; border: 2px solid #e9ecef;
            border-radius: 25px; font-size: 1rem;
        }

        .search-input:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; border: none; padding: 1rem 2rem;
            border-radius: 25px; cursor: pointer; font-weight: 600;
            transition: all 0.3s;
        }

        .search-btn:hover { transform: translateY(-2px); }

        .filter-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }

        .filter-btn {
            padding: 0.75rem 1.5rem; border: 2px solid #e9ecef;
            background: white; border-radius: 20px; cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; border-color: transparent;
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem; margin-bottom: 3rem;
        }

        .product-card {
            background: white; border-radius: 20px; padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s; position: relative; cursor: pointer;
        }

        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%; height: 200px; border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover; background-position: center;
            background-repeat: no-repeat; margin-bottom: 1rem;
            position: relative; overflow: hidden;
        }

        .product-image img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 15px; position: absolute; top: 0; left: 0;
        }

        .product-image .fallback-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; color: white; opacity: 0.8;
            z-index: 1;
        }

        .product-image::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            opacity: 0; transition: opacity 0.3s;
        }

        .product-card:hover .product-image::before {
            opacity: 1;
        }

        .product-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .product-title { 
            font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;
            line-height: 1.3; height: 2.6rem; overflow: hidden;
        }

        .product-price { 
            font-size: 1.3rem; font-weight: 700; color: #f44336; 
            margin-bottom: 0.5rem; 
        }

        .product-original-price {
            font-size: 1rem; color: #999; text-decoration: line-through;
            margin-right: 0.5rem;
        }

        .product-discount {
            background: #4CAF50; color: white; padding: 0.2rem 0.5rem;
            border-radius: 10px; font-size: 0.8rem; font-weight: 600;
        }

        .product-rating { 
            display: flex; align-items: center; gap: 0.5rem; 
            margin-bottom: 1rem; 
        }

        .stars { color: #f39c12; font-size: 1rem; }
        .rating-count { font-size: 0.9rem; color: #666; }

        .product-features {
            margin-bottom: 1rem;
        }

        .feature-tag {
            display: inline-block; background: rgba(102, 126, 234, 0.1);
            color: #667eea; padding: 0.2rem 0.5rem; border-radius: 10px;
            font-size: 0.8rem; margin-right: 0.5rem; margin-bottom: 0.3rem;
        }

        .add-to-cart-btn {
            width: 100%; background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; border: none; padding: 1rem; border-radius: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }

        .add-to-cart-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .recommendation-badge {
            position: absolute; top: 1rem; right: 1rem;
            background: linear-gradient(45deg, #f44336, #ff9800);
            color: white; padding: 0.3rem 0.8rem; border-radius: 15px;
            font-size: 0.7rem; font-weight: 600;
            display: flex; align-items: center; gap: 0.3rem;
        }

        .stock-status {
            position: absolute; top: 1rem; left: 1rem;
            background: #4CAF50; color: white; padding: 0.3rem 0.8rem;
            border-radius: 15px; font-size: 0.7rem; font-weight: 600;
        }

        .stock-status.low-stock { background: #ff9800; }
        .stock-status.out-of-stock { background: #f44336; }

        .toast {
            position: fixed; top: 100px; right: 2rem; z-index: 5000;
            background: white; border-radius: 12px; padding: 1rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transform: translateX(400px); transition: transform 0.3s;
            border-left: 4px solid #4CAF50;
        }

        .toast.show { transform: translateX(0); }

        .results-info {
            text-align: center; margin-bottom: 2rem; padding: 1rem;
            background: rgba(255, 255, 255, 0.9); border-radius: 15px;
        }

        .load-more-btn {
            display: block; margin: 2rem auto; padding: 1rem 2rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 25px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
        }

        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        /* Order Tracking Modal Styles */
        .tracking-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }

        .tracking-modal.show { opacity: 1; }

        .modal-content {
            background: white; border-radius: 20px; padding: 0;
            max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
            transform: translateY(-50px); transition: transform 0.3s;
        }

        .tracking-modal.show .modal-content { transform: translateY(0); }

        .modal-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; padding: 1.5rem; border-radius: 20px 20px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .close-btn {
            background: none; border: none; color: white; font-size: 2rem;
            cursor: pointer; padding: 0; line-height: 1;
        }

        .modal-body { padding: 2rem; }

        .order-summary h3 { margin-bottom: 1.5rem; color: #333; }

        .tracking-options { margin-bottom: 2rem; }

        .track-btn {
            width: 100%; background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white; border: none; padding: 1rem; border-radius: 12px;
            font-weight: 600; cursor: pointer; font-size: 1rem; margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .track-btn:hover { transform: translateY(-2px); }

        .track-existing { display: flex; gap: 1rem; }

        .track-existing input {
            flex: 1; padding: 0.75rem; border: 2px solid #e9ecef;
            border-radius: 10px; font-size: 1rem;
        }

        .track-existing button {
            background: #667eea; color: white; border: none; padding: 0.75rem 1.5rem;
            border-radius: 10px; cursor: pointer; font-weight: 600;
        }

        .tracking-timeline {
            margin: 1.5rem 0;
        }

        .timeline-step {
            display: flex; align-items: center; margin-bottom: 1.5rem;
            position: relative;
        }

        .timeline-step:not(:last-child)::after {
            content: ''; position: absolute; left: 20px; top: 40px;
            width: 2px; height: 30px; background: #e9ecef;
        }

        .timeline-step.completed::after { background: #4CAF50; }
        .timeline-step.active::after { background: #ff9800; }

        .step-icon {
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: bold;
            margin-right: 1rem; font-size: 1.2rem;
        }

        .timeline-step.completed .step-icon {
            background: #4CAF50; color: white;
        }

        .timeline-step.active .step-icon {
            background: #ff9800; color: white;
        }

        .timeline-step .step-icon {
            background: #f5f5f5; color: #999;
        }

        .step-content h4 { margin: 0 0 0.25rem 0; color: #333; }

        .step-title { font-weight: 600; margin-bottom: 0.25rem; }
        .step-time { color: #666; font-size: 0.9rem; }

        .delivery-info {
            background: #f8f9ff; padding: 1.5rem; border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .delivery-info p { margin: 0.5rem 0; }

        /* User Modal Additional Styles */
        .user-info {
            background: linear-gradient(45deg, #f093fb, #f5f7ff);
            padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;
            text-align: center;
        }

        .user-info h3 { margin: 0 0 0.5rem 0; color: #333; }
        .user-info p { margin: 0; color: #666; }

        .order-history h3 { margin-bottom: 1rem; color: #333; }

        .order-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8f9ff; padding: 1rem; border-radius: 12px;
            margin-bottom: 1rem; border-left: 4px solid #667eea;
        }

        .order-id { font-weight: 600; color: #333; font-size: 0.9rem; }
        .order-products { color: #666; margin: 0.25rem 0; }
        .order-date { font-size: 0.85rem; color: #999; }

        .order-status {
            padding: 0.25rem 0.75rem; border-radius: 15px; font-size: 0.8rem;
            font-weight: 600; margin: 0.25rem 0;
        }

        .order-status.delivered { background: #d4edda; color: #155724; }
        .order-status.shipped { background: #fff3cd; color: #856404; }
        .order-status.processing { background: #cce5ff; color: #004085; }

        .order-amount {
            font-weight: 700; color: #f44336; font-size: 1.1rem;
        }

        .quick-actions {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem; margin-top: 2rem;
        }

        .action-btn {
            background: white; border: 2px solid #667eea; color: #667eea;
            padding: 1rem; border-radius: 12px; cursor: pointer;
            font-weight: 600; transition: all 0.3s; text-align: center;
        }

        .action-btn:hover {
            background: #667eea; color: white; transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .hero-section { grid-template-columns: 1fr; text-align: center; }
            .hero-title { font-size: 2rem; }
            .search-container { flex-direction: column; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-shopping-cart"></i>
                <span>ShopMart AI</span>
            </div>
            <div class="nav-actions">
                <div class="cart-icon" onclick="handleCartClick()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="user-avatar" onclick="handleUserClick()">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="hero-section">
            <div>
                <h1 class="hero-title">
                    <span class="gradient-text">AI-Powered</span>
                    Shopping Experience
                </h1>
                <p class="hero-subtitle">
                    Advanced machine learning algorithms that understand your preferences 
                    and recommend products you'll love.
                </p>
                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-number">10.0K</span>
                        <span class="stat-label">Happy Customers</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">95</span>
                        <span class="stat-label">% Accuracy</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">50.0K</span>
                        <span class="stat-label">Products</span>
                    </div>
                </div>
                <button class="cta-button" onclick="scrollToProducts()">
                    <i class="fas fa-rocket"></i> Explore Smart Recommendations
                </button>
            </div>
            <div>
                <canvas id="heroCanvas"></canvas>
            </div>
        </section>

        <section class="search-section">
            <h2 class="section-title">Smart Product Discovery</h2>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="Search electronics, laptops, phones..." onkeyup="handleSearch()" onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="performSearch()">
                    <i class="fas fa-magic"></i> AI Search
                </button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('all', this)">All Products</button>
                <button class="filter-btn" onclick="setFilter('electronics', this)">Electronics</button>
                <button class="filter-btn" onclick="setFilter('laptops', this)">Laptops</button>
                <button class="filter-btn" onclick="setFilter('phones', this)">Phones</button>
                <button class="filter-btn" onclick="setFilter('audio', this)">Audio</button>
                <button class="filter-btn" onclick="setFilter('gaming', this)">Gaming</button>
            </div>
        </section>

        <div class="results-info" id="resultsInfo" style="display: none;">
            <h3 id="searchResultTitle"></h3>
            <p id="searchResultCount"></p>
        </div>

        <section>
            <h2 class="section-title" id="productsTitle">Recommended For You</h2>
            <div class="products-grid" id="productsGrid"></div>
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreProducts()" style="display: none;">
                <i class="fas fa-plus"></i> Load More Electronics
            </button>
        </section>
    </div>

        // Initialize App
        function initApp() {
            displayProducts();
            init3D();
            console.log('✅ Electronics store loaded with', products.length, 'products!');
        }

        // Display Products with Search/Filter Logic
        function displayProducts() {
            let filteredProducts = products;
            
            // Apply search filter
            if (currentSearchQuery) {
                filteredProducts = products.filter(product =>
                    product.name.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    product.tags.some(tag => tag.toLowerCase().includes(currentSearchQuery.toLowerCase())) ||
                    product.description.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    product.category.toLowerCase().includes(currentSearchQuery.toLowerCase())
                );
            }
            
            // Apply category filter
            if (currentFilter !== 'all') {
                filteredProducts = filteredProducts.filter(product =>
                    product.category === currentFilter || 
                    product.subcategory === currentFilter ||
                    product.tags.includes(currentFilter)
                );
            }
            
            // Sort by AI recommendations first, then by rating
            filteredProducts.sort((a, b) => {
                if (a.isRecommended && !b.isRecommended) return -1;
                if (!a.isRecommended && b.isRecommended) return 1;
                return b.rating - a.rating;
            });
            
            // Update UI based on results
            updateResultsInfo(filteredProducts);
            
            // Paginate results
            const startIndex = 0;
            const endIndex = currentPage * productsPerPage;
            const productsToShow = filteredProducts.slice(startIndex, endIndex);
            
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = productsToShow.map(product => createProductHTML(product)).join('');
            
            // Show/hide load more button
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (endIndex < filteredProducts.length) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.innerHTML = `<i class="fas fa-plus"></i> Load More (${filteredProducts.length - endIndex} remaining)`;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        // Create Product HTML with Images
        function createProductHTML(product) {
            const discountBadge = product.discount > 0 ? 
                `<span class="product-discount">${product.discount}% OFF</span>` : '';
                
            const stockStatus = product.stockCount > 10 ? 'In Stock' : 
                               product.stockCount > 0 ? 'Low Stock' : 'Out of Stock';
            const stockClass = product.stockCount > 10 ? 'stock-status' : 
                             product.stockCount > 0 ? 'stock-status low-stock' : 'stock-status out-of-stock';
                             
            const recommendationBadge = product.isRecommended ? 
                `<div class="recommendation-badge">
                    <i class="fas fa-star"></i> AI Pick
                </div>` : '';

            return `
                <div class="product-card" onclick="viewProduct(${product.id})">
                    ${recommendationBadge}
                    <div class="${stockClass}">${stockStatus}</div>
                    
                    <div class="product-image" style="background-image: url('${product.image}')">
                        <img src="${product.image}" alt="${product.name}" 
                             onload="this.style.opacity=1" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                        <div class="fallback-icon" style="display: none;">
                            <i class="${product.icon}"></i>
                        </div>
                    </div>
                    
                    <div class="product-title">${product.name}</div>
                    
                    <div class="product-price">
                        ₹${product.price.toLocaleString()}
                        ${product.originalPrice && product.originalPrice !== product.price ? 
                            `<span class="product-original-price">₹${product.originalPrice.toLocaleString()}</span>
                             ${discountBadge}` : ''
                        }
                    </div>
                    
                    <div class="product-rating">
                        <div class="stars">
                            ${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}
                        </div>
                        <span class="rating-count">(${product.rating}) • ${Math.floor(Math.random() * 500 + 100)} reviews</span>
                    </div>
                    
                    <div class="product-features">
                        ${product.features.slice(0, 2).map(feature => 
                            `<span class="feature-tag">${feature}</span>`
                        ).join('')}
                    </div>
                    
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id}, event)" 
                            ${product.stockCount === 0 ? 'disabled' : ''}>
                        <i class="fas fa-cart-plus"></i> 
                        ${product.stockCount === 0 ? 'Out of Stock' : 'Add to Cart'}
                    </button>
                </div>
            `;
        }

        // Update Results Info
        function updateResultsInfo(filteredProducts) {
            const resultsInfo = document.getElementById('resultsInfo');
            const searchResultTitle = document.getElementById('searchResultTitle');
            const searchResultCount = document.getElementById('searchResultCount');
            const productsTitle = document.getElementById('productsTitle');
            
            if (currentSearchQuery || currentFilter !== 'all') {
                resultsInfo.style.display = 'block';
                
                let title = '';
                if (currentSearchQuery && currentFilter !== 'all') {
                    title = `"${currentSearchQuery}" in ${currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1)}`;
                } else if (currentSearchQuery) {
                    title = `"${currentSearchQuery}"`;
                } else {
                    title = currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
                }
                
                searchResultTitle.textContent = `Search Results for ${title}`;
                searchResultCount.textContent = `Found ${filteredProducts.length} products`;
                productsTitle.textContent = `${filteredProducts.length} Products Found`;
            } else {
                resultsInfo.style.display = 'none';
                productsTitle.textContent = 'Recommended For You';
            }
        }

        // Handle Search Input
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentSearchQuery = query;
            currentPage = 1;
            displayProducts();
        }

        // Handle Enter Key Press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        // Perform Search
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentSearchQuery = query;
            currentPage = 1;
            displayProducts();
            
            if (query) {
                showToast(`🔍 Searching for "${query}" - Found electronics!`);
                console.log('🔍 Search performed:', query);
            }
        }

        // Set Category Filter
        function setFilter(category, button) {
            currentFilter = category;
            currentPage = 1;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            displayProducts();
            
            const categoryName = category === 'all' ? 'All Products' : 
                               category.charAt(0).toUpperCase() + category.slice(1);
            showToast(`📱 Showing ${categoryName}`);
            console.log('🔍 Filter changed to:', category);
        }

        // Load More Products
        function loadMoreProducts() {
            currentPage++;
            displayProducts();
            showToast(`📦 Loading more products...`);
        }

        // Scroll to Products
        function scrollToProducts() {
            document.querySelector('.products-grid').scrollIntoView({ behavior: 'smooth' });
            showToast('🚀 Scrolling to electronics catalog');
            console.log('🚀 Scrolling to products');
        }

        // Add to Cart Function
        function addToCart(productId, event) {
            event.stopPropagation();
            const product = products.find(p => p.id === productId);
            
            if (product.stockCount === 0) {
                showToast(`❌ ${product.name} is out of stock`);
                return;
            }
            
            cartCount++;
            document.getElementById('cartCount').textContent = cartCount;
            document.getElementById('cartCount').style.display = 'flex';
            
            showToast(`🛒 ${product.name} added to cart! (₹${product.price.toLocaleString()})`);
            
            // Button animation
            event.target.style.transform = 'scale(0.95)';
            setTimeout(() => event.target.style.transform = 'scale(1)', 150);
            
            console.log('✅ Product added:', product.name, '- Price:', product.price);
        }

        // View Product Details
        function viewProduct(productId) {
            const product = products.find(p => p.id === productId);
            showToast(`👀 Viewing ${product.name} - ${product.features.join(', ')}`);
            console.log('👀 Viewing product:', product.name, product);
        }

                                    <div class="order-id">Order #SME123GHI456</div>
                                    <div class="order-products">iPhone 15 Pro Max, AirPods Pro</div>
                                    <div class="order-status processing">📦 Processing</div>
                                    <div class="order-date">Placed on Sep 25, 2025</div>
                                </div>
                                <div class="order-amount">₹1,84,800</div>
                            </div>
                        </div>
                        
                        <div class="quick-actions">
                            <button class="action-btn" onclick="showToast('🔍 Opening order tracking...')">
                                <i class="fas fa-search"></i> Track All Orders
                            </button>
                            <button class="action-btn" onclick="showToast('🔄 Checking for returns...')">
                                <i class="fas fa-undo"></i> Returns & Exchanges
                            </button>
                            <button class="action-btn" onclick="showToast('📋 Downloading invoices...')">

            `;
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 100);
        }

        // Show Toast Notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Initialize 3D Animation
        function init3D() {
            const canvas = document.getElementById('heroCanvas');
            if (!window.THREE) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, canvas.offsetWidth / canvas.offsetHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            
            renderer.setSize(canvas.offsetWidth, canvas.offsetHeight);
            renderer.setClearColor(0x000000, 0);

            // Create electronic device shapes
            const devices = [];
            
            // Laptop shapes
            for (let i = 0; i < 5; i++) {
                const geometry = new THREE.BoxGeometry(1.5, 0.1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0x667eea, wireframe: true });
                const laptop = new THREE.Mesh(geometry, material);
                
                laptop.position.set(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8
                );
                laptop.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                scene.add(laptop);
                devices.push(laptop);
            }
            
            // Phone shapes
            for (let i = 0; i < 4; i++) {
                const geometry = new THREE.BoxGeometry(0.5, 1, 0.1);
                const material = new THREE.MeshBasicMaterial({ color: 0x764ba2, wireframe: true });
                const phone = new THREE.Mesh(geometry, material);
                
                phone.position.set(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8
                );
                scene.add(phone);
                devices.push(phone);
            }

            camera.position.z = 6;

            function animate() {
                requestAnimationFrame(animate);
                devices.forEach(device => {
                    device.rotation.x += 0.005;
                    device.rotation.y += 0.01;
                    device.position.y += Math.sin(Date.now() * 0.001 + device.position.x) * 0.002;
                });
                renderer.render(scene, camera);
            }
            animate();
            
            // Handle resize
            window.addEventListener('resize', () => {
                if (canvas.offsetWidth > 0) {
                    camera.aspect = canvas.offsetWidth / canvas.offsetHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(canvas.offsetWidth, canvas.offsetHeight);
                }
            });
        }

        // Auto-suggest when typing "electronics"
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const value = e.target.value.toLowerCase();
            if (value.includes('electronic') && currentFilter === 'all') {
                setTimeout(() => {
                    if (document.getElementById('searchInput').value.toLowerCase().includes('electronic')) {
                        setFilter('electronics', document.querySelectorAll('.filter-btn')[1]);
                    }
                }, 500);
            }
        });

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
